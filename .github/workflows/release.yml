name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de versión a publicar (ej. v1.6.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  ci:
    name: Verificación previa de CI
    uses: ./.github/workflows/ci.yml

  build-tauri:
    name: Build (${{ matrix.platform }})
    needs: [ci]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-latest"
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Install frontend dependencies
        run: cd tauri-app && npm ci

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./tauri-app"
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          releaseName: "ytms-player __VERSION__"
          releaseBody: "Consulte el historial de cambios en docs/changelog.md para conocer las novedades de esta versión."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
