[package]
name = "ytms-player"
version = "1.9.23"
description = "Your Tracks Music Server (ytms-player) - High performance local media manager and player"
authors = ["Joel Alejandro Sanchez Valdez <joelalejsanchez@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "fs", "net", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
