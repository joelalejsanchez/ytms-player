version: "3.8"

services:
  ytms-player-backend:
    build:
      context: ./go-microservice
      dockerfile: Dockerfile
    container_name: ytms-player-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - MAX_WORKERS=${MAX_WORKERS:-3}
      - COOKIES_FILE=/app/config/cookies.txt
      - HOST_WORKSPACE_PREFIX=${HOST_WORKSPACE_PREFIX:-}
      - CONTAINER_WORKSPACE_PREFIX=/app/workspace
      - OAUTH_MOCK_MODE=${OAUTH_MOCK_MODE:-true}
    volumes:
      - ${YTMS_PLAYER_WORKSPACE_HOST:-./workspace}:/app/workspace
      - ./config/cookies.txt:/app/config/cookies.txt:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
